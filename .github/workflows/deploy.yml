name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: firebase deploy --only 대상 (비우면 FIREBASE_DEPLOY_ONLY 변수 사용)
        required: false

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 서비스 계정 시크릿을 등록하기 전에는 배포 단계를 건너뛴다
  HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
  ONLY: ${{ inputs.only || vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore,functions,storage' }}
  NUXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NUXT_PUBLIC_FIREBASE_API_KEY }}
  # 운영은 앱과 같은 사이트에서 로그인 처리(서드파티 저장소 차단 대응). PR 미리보기는 기본 authDomain 사용
  NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ github.event_name != 'pull_request' && (vars.FIREBASE_PROD_AUTH_DOMAIN || 'toonflow-studio.web.app') || vars.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NUXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_APP_ID }}

jobs:
  deploy:
    # 포크 PR에는 시크릿이 없으므로 건너뛴다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm generate

      # PR: 미리보기 채널(7일)에 앱만 올리고 PR에 주소를 댓글로 남긴다
      - if: env.HAS_SA == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: toonflow-351ed
          expires: 7d

      # main / 수동 실행: 운영 배포
      - if: env.HAS_SA == 'true' && github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub 시크릿 GEMINI_API_KEY를 Functions 시크릿(Secret Manager)으로 옮긴다. 값이 같으면 새 버전을 만들지 않는다
      - if: env.HAS_SA == 'true' && github.event_name != 'pull_request' && contains(env.ONLY, 'functions')
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::warning::GEMINI_API_KEY 시크릿이 없어 Functions 시크릿을 갱신하지 않아요"; exit 0; fi
          current="$(pnpm exec firebase functions:secrets:access GEMINI_API_KEY --project default 2>/dev/null || true)"
          if [ "$current" != "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | pnpm exec firebase functions:secrets:set GEMINI_API_KEY --project default --non-interactive --data-file=-
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # PUB-24: Meta 앱의 Instagram 앱 ID·시크릿. 없으면 "unset"으로 두고 Instagram 게시를 끈 채로 배포한다 (함수가 시크릿을 참조해서 비워 둘 수 없다)
      - if: env.HAS_SA == 'true' && github.event_name != 'pull_request' && contains(env.ONLY, 'functions')
        run: |
          for name in INSTAGRAM_APP_ID INSTAGRAM_APP_SECRET; do
            value="${!name}"
            current="$(pnpm exec firebase functions:secrets:access "$name" --project default 2>/dev/null || true)"
            if [ -z "$value" ]; then
              if [ -n "$current" ]; then continue; fi
              echo "::warning::$name 시크릿이 없어 Instagram 게시를 끈 채로 배포해요"
              value=unset
            fi
            if [ "$current" != "$value" ]; then
              printf '%s' "$value" | pnpm exec firebase functions:secrets:set "$name" --project default --non-interactive --data-file=-
            fi
          done
        env:
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      # PUB-03: 출력 때 Canvas가 Storage 이미지를 읽을 수 있게 버킷 CORS를 연다 (storage.cors.json)
      - if: env.HAS_SA == 'true' && github.event_name != 'pull_request' && contains(env.ONLY, 'storage')
        uses: google-github-actions/setup-gcloud@v3
      - if: env.HAS_SA == 'true' && github.event_name != 'pull_request' && contains(env.ONLY, 'storage')
        run: gcloud storage buckets update gs://toonflow-351ed.firebasestorage.app --cors-file=storage.cors.json || echo "::warning::Storage CORS를 설정하지 못했어요. 서비스 계정에 Storage 관리자 권한이 필요해요"
      - if: env.HAS_SA == 'true' && github.event_name != 'pull_request'
        run: pnpm exec firebase deploy --project default --non-interactive --force --only "$ONLY"
